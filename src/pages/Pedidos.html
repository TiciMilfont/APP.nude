<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanchys - Pedidos para a Cozinha</title>
  <link rel="stylesheet" href="../App.css">
</head>
<body>

  <!-- HEADER / CABEÇALHO -->
  <header>
    <h1>LANCHYS</h1>
    <p>Painel da Cozinha</p>
  </header>

  <!-- CONTEÚDO PRINCIPAL: PAINEL DA COZINHA -->
  <main class="secao-cozinha-pagina">
    <h2 class="titulo-pagina-cozinha">PEDIDOS PARA A COZINHA</h2>

    <div class="container-pedidos-cozinha">
      
      <!-- CARD DE PEDIDO #001 -->
      <article class="card-pedido-cozinha">
        <div class="topo-pedido">
          <h3>PEDIDO #001</h3>
          <p><strong>Mesa:</strong> 03</p>
          <p><strong>Horário:</strong> 12:15</p>
        </div>

        <hr>

        <div class="itens-pedido-cozinha">
          <p><strong>2x</strong> Hot-Dog Especial</p>
          <p><strong>2x</strong> Coca-Cola</p>
        </div>

        <hr>

        <div class="status-pedido-container">
          <span>STATUS:</span>
          <button class="btn-status status-preparando">
            [ Preparando ]
          </button>
        </div>
      </article>

      <!-- CARD DE PEDIDO #002 (EXEMPLO) -->
      <article class="card-pedido-cozinha">
        <div class="topo-pedido">
          <h3>PEDIDO #002</h3>
          <p><strong>Mesa:</strong> 05</p>
          <p><strong>Horário:</strong> 12:30</p>
        </div>

        <hr>

        <div class="itens-pedido-cozinha">
          <p><strong>1x</strong> Hot-Dog Tradicional</p>
          <p><strong>1x</strong> Suco</p>
        </div>

        <hr>

        <div class="status-pedido-container">
          <span>STATUS:</span>
          <button class="btn-status status-recebido">
            [ Recebido ]
          </button>
        </div>
      </article>

    </div>
  </main>

</body>
</html>
